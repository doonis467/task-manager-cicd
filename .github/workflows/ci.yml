name: Java Application CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  REQUIRED_JAVA: '21'
  REQUIRED_MAVEN: '3.10.0'
jobs:
  check-toolchain:
    name: Check Java and Maven versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Maven
        shell: pwsh
        run: ./scripts/Install-Maven.ps1 -Version $env:REQUIRED_MAVEN
      - name: Check required versions
        shell: pwsh
        run: ./scripts/Check-Toolchain.ps1 -RequiredJava ([int]$env:REQUIRED_JAVA) -RequiredMaven $env:REQUIRED_MAVEN
  verify:
    name: Build, unit and integration tests
    needs: check-toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install required Maven
        shell: pwsh
        run: ./scripts/Install-Maven.ps1 -Version $env:REQUIRED_MAVEN
      - name: Show and recheck toolchain on build runner
        shell: pwsh
        run: |
          ./scripts/Check-Toolchain.ps1 -RequiredJava ([int]$env:REQUIRED_JAVA) -RequiredMaven $env:REQUIRED_MAVEN
          git --version
      - name: Build and verify
        shell: pwsh
        run: mvn -B -ntp clean verify
      - name: Generate Surefire HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/surefire-reports') {
            mvn -B -ntp surefire-report:report-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Generate JaCoCo HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/jacoco.exec') {
            mvn -B -ntp jacoco:report
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: task-manager-jar
          path: target/task-manager-cicd-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
